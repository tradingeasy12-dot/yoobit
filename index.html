<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seam — Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110D;
    --surface:#1F1A14;
    --surface-2:#2A231B;
    --copper:#C97A3D;
    --copper-light:#E0A268;
    --spark:#4FD8C4;
    --text:#F2EDE4;
    --text-muted:#9C948A;
    --danger:#E15554;
    --line: rgba(242,237,228,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 50% -10%, #241d16 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding:20px 20px 32px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(155deg, var(--copper-light), var(--copper) 60%, #8a5527);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#1a1208;
  }
  .brand-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.02em;
  }
  .hello{
    font-size:12px;
    color:var(--text-muted);
    text-align:right;
  }

  .balance-card{
    background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 22px 20px;
  }
  .balance-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--text-muted);
    margin-bottom:8px;
  }
  .balance-value{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:38px;
    color:var(--copper-light);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .balance-value small{
    font-size:14px;
    color:var(--text-muted);
    font-weight:500;
  }
  .stat-row{
    display:flex;
    gap:14px;
    margin-top:16px;
  }
  .stat{
    flex:1;
    background:rgba(0,0,0,0.18);
    border-radius:12px;
    padding:10px 12px;
  }
  .stat-k{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;}
  .stat-v{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;margin-top:3px;}

  /* --- Signature element: the seam ring --- */
  .seam-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 0 6px;
  }
  .seam-ring{
    position:relative;
    width:220px;
    height:220px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .seam-ring::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    padding:10px;
    background: conic-gradient(var(--copper) calc(var(--progress, 0) * 1%), rgba(255,255,255,0.06) 0);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    transition: background 0.3s linear;
  }
  .seam-core{
    width:172px;height:172px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #2d251a, #171209 70%);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    transition: transform 0.12s ease;
  }
  .seam-core:active{ transform:scale(0.96); }
  .seam-core.locked{ cursor:default; }
  .seam-core .icon{
    font-size:34px;
    margin-bottom:6px;
    filter: drop-shadow(0 0 10px rgba(201,122,61,0.5));
  }
  .seam-core .label{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
  }
  .seam-core .sub{
    margin-top:4px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
  }
  .seam-core.ready .icon{ color:var(--spark); }
  .toast{
    text-align:center;
    font-size:13px;
    min-height:18px;
    color:var(--spark);
  }
  .toast.error{ color:var(--danger); }

  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--text-muted);
    line-height:1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div class="brand-name">Seam</div>
      </div>
      <div class="hello" id="hello">লোড হচ্ছে…</div>
    </div>

    <div class="balance-card">
      <div class="balance-label">Balance</div>
      <div class="balance-value"><span id="balance">0</span><small>SEAM</small></div>
      <div class="stat-row">
        <div class="stat">
          <div class="stat-k">প্রতি ট্যাপ</div>
          <div class="stat-v" id="mineAmount">—</div>
        </div>
        <div class="stat">
          <div class="stat-k">মোট মাইনড</div>
          <div class="stat-v" id="totalMined">—</div>
        </div>
      </div>
    </div>

    <div class="seam-stage">
      <div class="seam-ring" id="ring" style="--progress:0">
        <div class="seam-core" id="core">
          <div class="icon">⛏</div>
          <div class="label" id="coreLabel">লোড হচ্ছে…</div>
          <div class="sub" id="coreSub">&nbsp;</div>
        </div>
      </div>
      <div class="toast" id="toast">&nbsp;</div>
    </div>

    <div class="footer-note">
      প্রতিটি claim সার্ভারে যাচাই করা হয় — balance আপনার ডিভাইসে সেভ থাকে না।
    </div>
  </div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const els = {
  hello: document.getElementById('hello'),
  balance: document.getElementById('balance'),
  mineAmount: document.getElementById('mineAmount'),
  totalMined: document.getElementById('totalMined'),
  ring: document.getElementById('ring'),
  core: document.getElementById('core'),
  coreLabel: document.getElementById('coreLabel'),
  coreSub: document.getElementById('coreSub'),
  toast: document.getElementById('toast'),
};

let cooldownSeconds = 3600;
let cooldownEndAt = 0;
let timerHandle = null;

function fmt(n){ return Number(n || 0).toLocaleString(); }

function showToast(msg, isError){
  els.toast.textContent = msg;
  els.toast.className = 'toast' + (isError ? ' error' : '');
  setTimeout(() => { els.toast.textContent = '\u00A0'; }, 2500);
}

function setLocked(remainingMs){
  cooldownEndAt = Date.now() + remainingMs;
  els.core.classList.remove('ready');
  els.core.classList.add('locked');
  tick();
}

function setReady(){
  els.core.classList.add('ready');
  els.core.classList.remove('locked');
  els.coreLabel.textContent = 'Tap to mine';
  els.coreSub.textContent = 'প্রস্তুত';
  els.ring.style.setProperty('--progress', 100);
  clearInterval(timerHandle);
}

function tick(){
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    const remain = cooldownEndAt - Date.now();
    if (remain <= 0){
      setReady();
      return;
    }
    const pct = 100 - Math.min(100, (remain / (cooldownSeconds * 1000)) * 100);
    els.ring.style.setProperty('--progress', pct.toFixed(1));
    const s = Math.floor(remain / 1000);
    const hh = String(Math.floor(s/3600)).padStart(2,'0');
    const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    els.coreLabel.textContent = `${hh}:${mm}:${ss}`;
    els.coreSub.textContent = 'পরের mine পর্যন্ত';
  }, 1000);
}

async function api(path, body){
  const initData = tg?.initData || '';
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData, ...body }),
  });
  const data = await res.json();
  if (!res.ok) throw { status: res.status, ...data };
  return data;
}

async function init(){
  try{
    const data = await api('/api/verify');
    els.hello.textContent = `হ্যালো, ${data.displayName}`;
    els.balance.textContent = fmt(data.balance);
    els.mineAmount.textContent = fmt(data.mineAmount);
    els.totalMined.textContent = fmt(data.totalMined);
    cooldownSeconds = data.cooldownSeconds;

    if (data.cooldownRemaining > 0){
      setLocked(data.cooldownRemaining);
    } else {
      setReady();
    }
  } catch (err){
    els.hello.textContent = 'সংযোগ ব্যর্থ';
    els.coreLabel.textContent = 'রিলোড করুন';
    showToast(err.error || 'Telegram এর ভেতর থেকে খুলুন', true);
  }
}

els.core.addEventListener('click', async () => {
  if (!els.core.classList.contains('ready')) return;
  els.core.classList.remove('ready');
  try{
    const data = await api('/api/mine');
    els.balance.textContent = fmt(data.balance);
    els.totalMined.textContent = fmt((parseInt(els.totalMined.textContent.replace(/,/g,'')) || 0) + data.mined);
    showToast(`+${data.mined} SEAM পেয়েছেন`);
    tg?.HapticFeedback?.notificationOccurred('success');
    setLocked(data.cooldownRemaining);
  } catch (err){
    if (err.status === 429){
      showToast('এখনো cooldown চলছে', true);
      setLocked(err.cooldownRemaining);
    } else {
      showToast(err.error || 'কিছু ভুল হয়েছে', true);
      els.core.classList.add('ready');
    }
  }
});

init();
</script>
</body>
</html>
