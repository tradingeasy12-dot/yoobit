<style>
        .mining-hero-orb {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(36, 161, 222, 0.1) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-glow 4s ease-in-out infinite;
        }

        .mining-node-3d {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #24a1de 0%, #00658f 100%);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(36, 161, 222, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float-3d 6s ease-in-out infinite;
            z-index: 10;
        }

        .orbit-particle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #86cfff;
            border-radius: 50%;
            filter: blur(2px);
        }

        .particle-1 { top: 20%; left: 10%; animation: float-delayed 5s ease-in-out infinite; opacity: 0.6; }
        .particle-2 { bottom: 25%; right: 15%; animation: float-delayed 7s ease-in-out infinite 1s; opacity: 0.4; }
        .particle-3 { top: 50%; right: 5%; animation: float-delayed 4s ease-in-out infinite 2s; opacity: 0.8; }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes float-3d {
            0%, 100% { transform: translateY(0) rotateX(10deg) rotateY(10deg); }
            50% { transform: translateY(-15px) rotateX(-5deg) rotateY(-5deg); }
        }

        @keyframes float-delayed {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10px, -20px); }
        }

        .nav-item.active {
            color: #86cfff;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a141e;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="text-on-surface min-h-screen flex flex-col overflow-x-hidden pb-20">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between px-md py-4 border-b border-outline-variant bg-surface/80 backdrop-blur-md sticky top-0 z-50">

</div>

</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors relative">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
<span class="absolute top-2.5 right-2.5 w-2 h-2 bg-error rounded-full"></span>
</button>
</header>
<main class="flex-1 px-4 pt-8 max-w-md mx-auto w-full">
<!-- Central 3D Mining Hero -->
<div class="flex flex-col items-center justify-center mb-10">
<div class="mining-hero-orb">
<div class="orbit-particle particle-1"></div>
<div class="orbit-particle particle-2"></div>
<div class="orbit-particle particle-3"></div>
<div class="mining-node-3d">
<span class="material-symbols-outlined text-white text-5xl">hub</span>
</div>
</div>
</div>
<!-- Dashboard Stats -->
<div class="text-center mb-8">
<span class="text-label-md text-on-surface-variant uppercase tracking-[0.15em] block mb-2">Live Mining Activity</span>
<h2 class="text-4xl font-bold text-on-surface mb-2 tracking-tight">$124,591.47</h2>
<div class="flex items-center justify-center gap-1.5 text-secondary font-medium">
<span class="material-symbols-outlined text-sm">trending_up</span>
<span class="text-sm">+2.4% today</span>
</div>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-2 gap-4 mb-8">
<a class="flex items-center justify-center bg-primary-container text-white py-4 rounded-xl font-bold text-lg shadow-xl shadow-primary/10 active:scale-95 transition-transform" href="invest.html">
                Deposit
            </a>
<button class="flex items-center justify-center bg-surface-container-highest border border-outline-variant text-on-surface py-4 rounded-xl font-bold text-lg active:scale-95 transition-transform">
                Withdraw
            </button>
</div>
<!-- Status Cards -->
<div class="grid grid-cols-2 gap-4 mb-10">
<div class="bg-surface-container-low border border-outline-variant/30 p-4 rounded-2xl">
<span class="text-xs font-semibold text-on-surface-variant uppercase mb-1 block">Hashrate</span>
<p class="text-xl font-bold text-on-surface">45.2 TH/s</p>
</div>
<div class="bg-surface-container-low border border-outline-variant/30 p-4 rounded-2xl">
<span class="text-xs font-semibold text-on-surface-variant uppercase mb-1 block">Nodes</span>
<p class="text-xl font-bold text-on-surface">12 Active</p>
</div>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-surface-container-highest/90 backdrop-blur-lg border-t border-outline-variant/50 px-6 py-3 flex justify-between items-center z-50">
<a class="flex flex-col items-center gap-1 nav-item active" href="index.html">
<span class="material-symbols-outlined fill-1">home</span>
<span class="text-[10px] font-medium">Home</span>
</a>
<a class="flex flex-col items-center gap-1 nav-item text-on-surface-variant" href="invest.html">

<span class="text-[10px] font-medium">Invest</span>
</a>
<a class="flex flex-col items-center gap-1 nav-item text-on-surface-variant" href="history.html">

</a>
<!-- Admin button restricted to @cryptolife15 -->
<a class="hidden flex flex-col items-center gap-1 nav-item text-on-surface-variant" href="admin.html" id="admin-nav">
<span class="material-symbols-outlined">admin_panel_settings</span>
<span class="text-[10px] font-medium">Admin</span>
</a>
<a class="flex flex-col items-center gap-1 nav-item text-on-surface-variant" href="profile.html">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Profile</span>
</a>
</nav>
<script>
        /**
         * Admin Check Logic for Telegram Mini App
         * This logic ensures the admin navigation item is only visible to the specific user.
         */
        document.addEventListener('DOMContentLoaded', function() {
            // In a real TMA environment, you'd use window.Telegram.WebApp.initDataUnsafe.user.username
            // For production simulation, we check the global variable or mock it
            const currentUser = {
                username: 'user_placeholder' // Mock username
            };

            // In actual use: const username = window.Telegram?.WebApp?.initDataUnsafe?.user?.username;
            const targetAdmin = 'cryptolife15';
            
            // The request specified checking for '@cryptolife15'. Telegram usernames often come with or without @
            const adminNav = document.getElementById('admin-nav');
            
            // Logic to show admin button if username matches
            if (currentUser.username === targetAdmin || currentUser.username === '@' + targetAdmin) {
                adminNav.classList.remove('hidden');
            }
            
            // Demo toggle for testing if needed via console
            window.toggleAdmin = () => adminNav.classList.toggle('hidden');
        });
    </script>
</body></html>
